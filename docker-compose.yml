# OpenBB Platform API behind a Tailscale sidecar — Adventures in OpenBB, Ep. 1–2.
#
# The tailscale container owns the network namespace; the API joins it, so the
# pair appears on your tailnet as one node named "openbb". NOTHING is published
# to the LAN and no ports are mapped — Tailscale Serve is the only way in:
#
#   https://openbb.<your-tailnet>.ts.net/    (Serve terminates TLS, real LE cert)
#
# From v2.0.0 (Ep. 2) the API enforces HTTP Basic auth, and port 443 MAY be
# published to the public internet via Tailscale Funnel (swap serve.json for
# serve-funnel.json + allow the `funnel` node attribute in your tailnet
# policy — see docs/funnel.md). Lock first, then door: auth is REQUIRED
# before the funnel config exists, by construction.
#
# Before first start:
#   cp ts.env.example ts.env                     # Tailscale auth key, chmod 600
#   cp api-auth.env.example api-auth.env         # REQUIRED: API username/password
#   cp credentials.env.example credentials.env   # optional: provider API keys
#
# Verify after start (see README):
#   from any tailnet device:  https://openbb.<your-tailnet>.ts.net/widgets.json
#                             -> 401 without credentials, 200 with
#   from a SECOND device:     the raw port :6900 must be unreachable
services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    container_name: openbb-ts
    hostname: openbb
    restart: unless-stopped
    env_file:
      - ./ts.env
    environment:
      - TS_HOSTNAME=openbb
      # MANDATORY. The image defaults to userspace networking, where tailscaled
      # terminates inbound tailnet connections itself and forwards them to
      # 127.0.0.1 — which would make the API reachable AROUND Serve at
      # <node-ip>:6900. Kernel mode (this, plus the tun device and NET_ADMIN
      # below) makes the tailnet IP a real interface, so the 127.0.0.1 socket
      # below is genuinely unreachable from other peers.
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      # Persist node identity across restarts (otherwise every restart is a
      # brand-new machine joining with a possibly-expired key).
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # OpenBB Platform REST API. Binds 127.0.0.1 so only Serve can reach it.
  openbb-api:
    build: .
    image: openbb-local:1.0.0
    # ArcticDB publishes no aarch64 Linux wheels, so the image is amd64.
    # On Apple Silicon this runs under emulation -- correct, but slower.
    platform: linux/amd64
    container_name: openbb-api
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command: ["openbb-api", "--host", "127.0.0.1", "--port", "6900"]
    env_file:
      # Provider API keys (optional — keyless providers work with none).
      - path: ./credentials.env
        required: false
      # HTTP Basic auth (OPENBB_API_AUTH / USERNAME / PASSWORD). Funnel can
      # expose this port to the public internet, so this file is REQUIRED on
      # purpose: without it the API would come up unauthenticated.
      - path: ./api-auth.env
        required: true
      # Ep. 11: ARCTICDB_S3_* -- the MinIO store, shared with tick-lab.
      - path: ./minio.env
        required: false
    # Ep. 10: the kdb+ read-through cache. q runs as a CHILD of this container
    # on 127.0.0.1:5000 -- never 0.0.0.0. Every service here shares the
    # tailscale network namespace, so loopback reaches all of them and no
    # tailnet peer, while a 0.0.0.0 bind would publish an unauthenticated q
    # (which executes arbitrary q) to the whole tailnet.
    #
    # Bring your own license: register with KX, drop kc.lic into
    # ./kdb-license/ (git-ignored). Without it the cache passes through to
    # the upstream provider and the stack runs uncached.
    environment:
      - KDB_EMBEDDED=true
      - KDB_MEMORY_MB=8192
      - KDB_UPSTREAM=eodhd
      - QHOME=/opt/kx
      - QLIC=/opt/kx-license
    volumes:
      - openbb-data:/root/.openbb_platform
      - ./kdb-license:/opt/kx-license:ro
    # Cache budget (KDB_MEMORY_MB) is 8GB, but q's own -w ceiling is budget *
    # 1.25 = 10GB headroom -- see openbb_kdb/config.py's _WORKSPACE_HEADROOM.
    # Plus OpenBB's own ~2GB, that's ~12GB. Set the cgroup limit below q's -w
    # and the kernel OOM killer takes the whole container down -- API and
    # all -- instead of q hitting -w and dying alone.
    mem_limit: 12g

  # OpenBB MCP server (Ep. 6): wraps the same Platform app as openbb-api,
  # in-process, and serves MCP over streamable-http for the AI analyst.
  # Bound to 127.0.0.1; Serve publishes it on :8443 — tailnet-only, NEVER
  # funneled (it has no auth of its own; do NOT load api-auth.env here —
  # auth on this in-process wrapper breaks its tool calls).
  # Endpoint path is /mcp (a request to /mcp/ 307-redirects there).
  openbb-mcp:
    build: .
    image: openbb-local:6.0.0
    # ArcticDB publishes no aarch64 Linux wheels, so the image is amd64.
    # On Apple Silicon this runs under emulation -- correct, but slower.
    platform: linux/amd64
    container_name: openbb-mcp
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    # --default-categories + --tool-discovery keep the initial tools/list
    # small enough for a local model's context slot: all 219 tools cost
    # ~152k prompt tokens against a 65,536-token slot, which hard-errors
    # EVERY chat request. Discovery mode exposes ~10 tools (~1.4k tokens)
    # and lets the agent activate categories on demand. LOAD-BEARING —
    # removing these flags breaks chat completely (see Ep. 6's gotchas).
    command: ["openbb-mcp", "--host", "127.0.0.1", "--port", "6901",
              "--default-categories", "equity", "--tool-discovery"]
    environment:
      # Neutralize the unconditionally-registered `install_skill` admin tool:
      # its only write target is the bundled skills provider, and an agent
      # reaching this server could otherwise persist files that later agent
      # sessions read as trusted instructions (prompt-injection persistence).
      # No flag suppresses the tool itself; removing its write target is the
      # supported lever.
      - OPENBB_MCP_DEFAULT_SKILLS_DIR=
    env_file:
      - path: ./credentials.env
        required: false
    volumes:
      - openbb-data:/root/.openbb_platform

  # key-maint: the transport-tiered "key status" widget backend (Ep. 3).
  # One process, two servers: a network server on loopback :8447 (published by
  # Serve on :10000 — public ONLY if you funnel it, and it enforces the same
  # Basic auth as the API) and an admin server on a unix socket whose 0700
  # host directory IS the tier-3 authorization (filesystem access via SSH —
  # no port, no header).
  key-maint:
    build: ./key-maint
    image: openbb-key-maint:latest
    container_name: openbb-key-maint
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./credentials.env:/config/credentials.env:ro
      - ./api-auth.env:/config/api-auth.env:ro
      # Admin bind lives here. Create it 0700, owned by the host admin user:
      #   mkdir -p key-maint-admin && chmod 700 key-maint-admin
      - ./key-maint-admin:/config/admin

  # live-grid (Ep. 8): OpenBB Workspace live_grid backend streaming EODHD
  # websocket prices. Loopback :6903; Serve publishes it on :6903 —
  # tailnet-only unless you deliberately funnel it (it carries your market-
  # data key and has no auth of its own, so: don't).
  live-grid:
    build: ./live-grid
    image: openbb-live-grid:latest
    container_name: openbb-live-grid
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      # EODHD_API_KEY comes from here (the public demo websocket key covers
      # the default watchlist for testing).
      - path: ./credentials.env
        required: false

  # rss-ticker (Ep. 9): the news wire — polls RSS feeds, streams new articles
  # over a websocket, serves a Bloomberg-style news window widget. Source lives
  # in its own repo; compose builds it from GitHub. Loopback :8088; Serve
  # publishes it on :8088 — tailnet-only, NEVER funneled (under tailscale_auth
  # it trusts the identity header Serve injects, and a funneled request
  # carries none, so it would fail closed — but don't rely on that).
  #
  # Before first start:
  #   cp rss-ticker-config/config.yaml.example rss-ticker-config/config.yaml
  #   cp rss-ticker.env.example rss-ticker.env       # TICKER_ADMIN_KEY
  rss-ticker:
    build: https://github.com/artcashin/rss-ticker.git
    image: rss-ticker:9.0.0
    container_name: openbb-rss-ticker
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      # TICKER_ADMIN_KEY (writes on /api/feeds). Under tailscale_auth no
      # manifest key or user tokens are needed — identity replaces them.
      - path: ./rss-ticker.env
        required: true
    volumes:
      - ./rss-ticker-config:/config:ro
      - rss-ticker-data:/data

  # cache-chart (Ep. 10): the kdb+ cache demo — a Workspace chart widget and a
  # standalone page whose scroll gesture shows only the missing range being
  # fetched. Loopback :6906; Serve publishes it on :6906 — tailnet-only,
  # NEVER funneled (it holds API credentials and has no auth of its own).
  cache-chart:
    build: ./cache-chart
    image: openbb-cache-chart:latest
    container_name: openbb-cache-chart
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - openbb-api
    environment:
      - OPENBB_URL=http://127.0.0.1:6900
    env_file:
      # OPENBB_API_USERNAME / PASSWORD — the API enforces Basic auth.
      - path: ./api-auth.env
        required: true

  # --- Ep. 11: the shared store -------------------------------------------
  # MinIO, joined to the tailnet as its own node named "minio". No sidecar:
  # tailscaled runs INSIDE this container because its control socket is a file
  # and network_mode shares only the network namespace -- see minio/Dockerfile.
  #
  # NOTHING is published to the host. :9000 (S3) and :9001 (console) exist on
  # the tailscale interface only.
  #
  # Before first start:
  #   cp minio.env.example minio.env && chmod 600 minio.env
  minio:
    build: ./minio
    image: openbb-minio:11.0.0
    platform: linux/amd64
    container_name: openbb-minio
    hostname: minio
    restart: unless-stopped
    env_file:
      # TS_AUTHKEY -- the same reusable tagged key the openbb node uses.
      - path: ./ts.env
        required: true
      - path: ./minio.env
        required: true
    environment:
      - TS_HOSTNAME=minio
      - TS_STATE_DIR=/var/lib/tailscale
      # NOTE: the cert domain is NOT set here. Compose interpolates ${...} from
      # the shell or a root .env only -- never from env_file -- so referencing
      # ARCTICDB_S3_ENDPOINT here would silently expand to empty. The entrypoint
      # reads it from its own environment instead, where env_file did put it.
      - MINIO_CERT_RENEW_SECONDS=43200
    command: ["/data", "--console-address", ":9001"]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - minio-data:/data
      # Persist node identity across restarts, same as the openbb node's
      # ./ts-state -- otherwise every restart joins as a brand-new machine.
      - ./ts-state-minio:/var/lib/tailscale

  # One-shot: ArcticDB will NOT create its own bucket, so `docker compose up`
  # would otherwise leave you with a store that 404s on first write.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: openbb-minio-init
    network_mode: service:minio
    depends_on:
      - minio
    env_file:
      - path: ./minio.env
        required: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 60); do
          if mc alias set store "https://$${ARCTICDB_S3_ENDPOINT}:$${ARCTICDB_S3_PORT}" \
               "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; then
            mc mb --ignore-existing "store/$${ARCTICDB_S3_BUCKET}"
            echo "minio-init: bucket $${ARCTICDB_S3_BUCKET} ready"
            exit 0
          fi
          sleep 2
        done
        echo "minio-init: MinIO did not become reachable" >&2
        exit 1
    restart: "no"

volumes:
  openbb-data:
  rss-ticker-data:
  minio-data:
