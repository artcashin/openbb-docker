name: ci
on:
  push:
  pull_request:
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub gate — no private infrastructure details
        run: bash scripts/scrub-check.sh
  key-maint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test key-maint
        working-directory: key-maint
        run: |
          pip install -e .[dev]
          pytest -q
  live-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install kdb-store (live-grid's tick recorder depends on it)
        run: pip install -e ./kdb-store
      - name: Test live-grid (all mocked, no key or kdb+ needed)
        working-directory: live-grid
        run: |
          pip install -e .[dev]
          pytest -q
  openbb-eodhd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test the EODHD provider extension (mocked SDK)
        working-directory: openbb-eodhd
        run: |
          pip install -e .[dev]
          pytest -q
  openbb-kdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install kdb-store (openbb-kdb depends on it)
        run: pip install -e ./kdb-store
      - name: Test the kdb+ read-through cache provider (fake q connection, no license)
        working-directory: openbb-kdb
        run: |
          pip install -e .[dev]
          pytest -q
  kdb-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test kdb-store (fake q connection, no license, no network)
        working-directory: kdb-store
        run: |
          pip install -e .[dev]
          pytest -q
  # The Dockerfile's first stage is ghcr.io/artcashin/kdb-x:1.0, which is a
  # PRIVATE package: an anonymous manifest request gets a 403, so build-smoke
  # cannot build at all without a registry token. Rather than show every fork
  # and every secret-less run a red build for a credential they were never
  # given, the build job is gated on the secret being present.
  #
  # This has to be its own job: the `secrets` context is NOT available in a
  # job-level `if:` (only github/needs/vars/inputs are), so the check must run
  # inside a job and come back as an output.
  registry-token:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -n "$REGISTRY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REGISTRY_TOKEN is not set - skipping build-smoke. \
            The Dockerfile's kdb-x base image is private; set the secret (a PAT \
            with read:packages), or see the README for building against your own \
            q runtime."
          fi

  build-smoke:
    runs-on: ubuntu-latest
    needs: registry-token
    if: needs.registry-token.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the container registry (kdb-x is private)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build the image
        run: docker build -t openbb-local:ci .
      - name: No image layer carries a kdb+ licence
        run: |
          # Layers are ADDITIVE. Deleting the licence in a later layer leaves
          # an intact copy in the earlier one, which anyone who pulls the image
          # can extract with `docker save` even though the flattened filesystem
          # looks clean. That exact bug already shipped once on this branch, so
          # it gets a regression guard rather than a comment.
          #
          # A kc.lic may not be redistributed, so this is a licensing gate, not
          # a hygiene check -- it fails the build rather than warning.
          docker save openbb-local:ci -o /tmp/image.tar
          mkdir -p /tmp/image && tar -xf /tmp/image.tar -C /tmp/image
          # Layout differs between the classic (<hash>/layer.tar) and OCI
          # (blobs/sha256/<digest>, gzipped) formats, so try every regular file
          # as a tar, both compressed and not, and ignore whatever isn't one.
          find /tmp/image -type f -print0 \
            | xargs -0 -I{} sh -c 'tar -tzf "{}" 2>/dev/null || tar -tf "{}" 2>/dev/null' \
            > /tmp/entries.txt || true
          echo "scanned $(wc -l < /tmp/entries.txt) layer entries"
          test -s /tmp/entries.txt  # an empty scan would pass vacuously
          if grep -Eiq '\.(lic|license)$' /tmp/entries.txt; then
            grep -Ei '\.(lic|license)$' /tmp/entries.txt
            echo "::error::a kdb+ licence survives in an image layer"
            exit 1
          fi
          echo "no licence entry in any layer"
      - name: The bundled q matches the image architecture and executes
        run: |
          # COPY --from cannot fail on an architecture mismatch -- it copies
          # whatever the kdbx stage resolved to, and copying never executes
          # anything. So a wrong-arch q ships inside a perfectly green build
          # and only surfaces when openbb-api spawns it at runtime. That is
          # not hypothetical: kdb-x:latest was an arm64-only manifest until
          # 2026-08-05, and every amd64 build silently bundled AArch64
          # binaries. Assert both halves here, on this x86_64 runner.
          docker run --rm --entrypoint python3 openbb-local:ci -c 'import os,sys; m=os.uname().machine; want={"x86_64":0x3e,"aarch64":0xb7}[m]; d=open("/opt/kx/bin/q","rb").read(20); got=d[18]|(d[19]<<8); print(f"image={m} q e_machine=0x{got:x} want=0x{want:x}"); sys.exit(got!=want)'
          # kc.lic is deliberately absent from the image, so kdb+'s own
          # "license error" is how a working binary announces itself -- it
          # proves the ELF loaded and ran. A wrong-arch binary never reaches
          # that point: the kernel refuses the ELF and sh reports "not found".
          out=$(docker run --rm --entrypoint sh openbb-local:ci -c '/opt/kx/bin/q -e 0 </dev/null 2>&1' || true)
          echo "$out"
          echo "$out" | grep -q 'license error' || { echo "::error::bundled q did not execute"; exit 1; }
      - name: Boot the API with Basic auth
        run: |
          docker run -d --name api \
            -e OPENBB_API_AUTH=true -e OPENBB_API_USERNAME=ci -e OPENBB_API_PASSWORD=ci-secret \
            openbb-local:ci
          for i in $(seq 1 60); do
            code=$(docker exec api curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6900/widgets.json || true)
            [ "$code" = "401" -o "$code" = "200" ] && break
            sleep 5
          done
      - name: Auth is enforced on the command endpoints (401 without, not-401 with)
        run: |
          # OpenBB's Basic auth hangs off the get_user_settings dependency, so it
          # guards /api/v1/* only. /widgets.json, /apps.json and /openapi.json are
          # metadata endpoints and answer 200 unauthenticated -- assert against a
          # command endpoint, which is what actually carries data.
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ep=http://127.0.0.1:6900/api/v1/equity/price/quote
          test "$(probe "$ep")" = "401"
          test "$(probe -u ci:WRONG "$ep")" = "401"
          # 422: credentials accepted, request reached validation (symbol is
          # required). Keeps the check free of any outbound provider call.
          test "$(probe -u ci:ci-secret "$ep")" = "422"
      - name: The widget manifest is served
        run: |
          count=$(docker exec api curl -fsS -u ci:ci-secret http://127.0.0.1:6900/widgets.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "widgets: $count"; test "$count" -gt 50
