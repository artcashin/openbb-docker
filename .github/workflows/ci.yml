name: ci
on:
  push:
  pull_request:
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub gate — no private infrastructure details
        run: bash scripts/scrub-check.sh
