name: Release images

# Publishes this repo's first-party images to GHCR, one set per version tag, so
# an episode's environment can be pulled back rather than rebuilt from source.
#
# The image set GROWS with the episodes -- key-maint arrives in Ep. 3, live-grid
# in Ep. 9, kdb-x in Ep. 10, minio and stores-explorer in Ep. 11. Building an
# older tag must therefore publish only what existed then, so the matrix is
# discovered from the checked-out tree instead of hardcoded.
#
# Backfilling matters as much as releasing forward: every tag before this file
# existed has no copy of it, so `workflow_dispatch --ref v9.0.0` would 404. The
# dispatch path therefore takes the tag as an INPUT, runs from the default
# branch, and checks the tag out itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v9.0.0). Defaults to the ref this runs on."
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      version: ${{ steps.set.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: ref
        run: echo "ref=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # github.sha is the dispatching branch's commit, not the tag's, so a
      # backfilled image would claim the wrong provenance. Read it post-checkout.
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The discovery step parses compose; don't rely on the runner image
      # happening to ship PyYAML for the system interpreter.
      - name: PyYAML
        run: pip install --quiet pyyaml

      - id: set
        name: Work out which images exist at this tag
        env:
          TARGET_REF: ${{ steps.ref.outputs.ref }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, yaml

          # docker-compose.yml at THIS tag is the source of truth, not a table in
          # this file: live-grid's context was ./live-grid in Ep. 9 and moved to
          # the repo root in Ep. 10, so a hardcoded context builds one of them
          # wrong. Read what that episode actually declared.
          entries, seen = [], set()

          compose = pathlib.Path("docker-compose.yml")
          services = {}
          if compose.exists():
              services = (yaml.safe_load(compose.read_text()) or {}).get("services", {}) or {}

          for svc, spec in services.items():
              build = spec.get("build")
              image = spec.get("image")
              if not build or not image:
                  continue
              context = build.get("context") if isinstance(build, dict) else build
              dockerfile = (build.get("dockerfile") if isinstance(build, dict) else None) or "Dockerfile"
              # rss-ticker builds from its own repo over https -- not ours to publish.
              if not context or "://" in context:
                  continue
              context = context.lstrip("./") or "."
              df_path = dockerfile if "/" in dockerfile else f"{context}/{dockerfile}".lstrip("./")
              if not pathlib.Path(df_path).exists():
                  continue
              name = image.split(":")[0]
              # openbb-api, openbb-mcp and stores-mcp are the SAME build declared
              # three times under different tags. Build it once.
              key = (name, context, df_path)
              if key in seen:
                  continue
              seen.add(key)
              # ArcticDB publishes manylinux x86_64 wheels only -- no aarch64 --
              # so any image that installs it cannot produce an arm64 layer. The
              # root Dockerfile says so itself from Ep. 11 onward.
              text = pathlib.Path(df_path).read_text(encoding="utf-8", errors="replace").lower()
              entries.append({
                  "name": name,
                  "context": context,
                  "dockerfile": df_path,
                  "platforms": "linux/amd64" if "arcticdb" in text else "linux/amd64,linux/arm64",
              })

          # kdb-x carries no compose service (the operator supplies their own q),
          # so it has to be named explicitly rather than discovered.
          if pathlib.Path("kdb-x/Dockerfile").exists():
              entries.append({
                  "name": "kdb-x",
                  "context": "kdb-x",
                  "dockerfile": "kdb-x/Dockerfile",
                  "platforms": "linux/amd64,linux/arm64",
              })

          ref = os.environ["TARGET_REF"]
          # Compose pins bare versions (openbb-local:11.0.0), so drop the v to
          # keep the published tag identical to what compose already asks for.
          print(f"version={ref.lstrip('v')}")
          print("matrix=" + json.dumps({"include": entries}))
          PY

      - name: Report the set
        run: |
          echo "version: ${{ steps.set.outputs.version }}"
          echo '${{ steps.set.outputs.matrix }}'

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ needs.discover.outputs.version }}
          # Restoring an episode means reading the image, so record where it came
          # from rather than leaving an untraceable blob in the registry.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.discover.outputs.version }}
            org.opencontainers.image.revision=${{ needs.discover.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
