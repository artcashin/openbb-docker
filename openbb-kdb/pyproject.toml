[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-kdb"
version = "10.0.0"
description = "kdb+ read-through cache provider for the OpenBB Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    # Upper bound is deliberate. This extension reaches past the documented
    # ODP surface (Provider/Fetcher/Data/QueryParams/Extension/OBBject plus
    # provider.utils.{helpers,errors}) into core internals, so a major core
    # release may move things that are not "breaking" by any published
    # contract. Fail at resolve time, not at runtime.
    "openbb-core>=1.5.8,<2",
    "pykx>=3.2",
    "kdb-store",
]

[project.entry-points."openbb_provider_extension"]
kdb = "openbb_kdb:kdb_provider"

[tool.setuptools.packages.find]
include = ["openbb_kdb*"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Lazy imports inside functions are intentional (heavy deps stay out of import time).
ignore = ["PLC0415"]
