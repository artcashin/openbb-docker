<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>kdb tick cache — live chart test</title>
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #111; color: #ddd; }
  #status { font-size: 13px; margin-bottom: 8px; }
  #status b { color: #6c6; }
  #chart { width: 100%; height: 75vh; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="chart"></div>
<script>
// ?sym=BTC-USD&interval=30&anchor=2026-08-28T14:30:00 to override;
// 10s bars so movement is visible fast; anchor defaults to UTC midnight
const qs = new URLSearchParams(location.search);
const SYM = qs.get('sym') || 'AAPL', INTERVAL_S = Number(qs.get('interval')) || 10;
const ANCHOR = qs.get('anchor') || new Date().toISOString().slice(0, 10) + 'T00:00:00';
const status = document.getElementById('status');

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background: { color: '#111' }, textColor: '#ddd' },
  grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
  timeScale: { timeVisible: true, secondsVisible: true },
});
const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});
const avLine = chart.addSeries(LightweightCharts.LineSeries, {
  color: '#f0ad4e', lineWidth: 2, priceLineVisible: false,
});

// lightweight-charts time = unix seconds, ascending and unique per series
const toSec = (iso) => Math.floor(Date.parse(iso.slice(0, 23) + 'Z') / 1000);
const bucketSec = (iso) => Math.floor(toSec(iso) / INTERVAL_S) * INTERVAL_S;

let bar = null;           // the in-progress bar
let ticks = 0, lastPrice = null;
// anchored VWAP overlay: seeded by the avwap response, extended per live
// tick from its running pv/vol totals. Ticks that arrive before the
// response are already inside its sums -- ready gates against double-count.
const av = { ready: false, pv: 0, vol: 0, lastSec: 0 };

function applyTick(r) {
  const t = bucketSec(r.time), p = r.price, v = r.size || 0;
  if (bar && bar.time === t) {
    bar.high = Math.max(bar.high, p); bar.low = Math.min(bar.low, p);
    bar.close = p;
  } else if (!bar || t > bar.time) {
    bar = { time: t, open: p, high: p, low: p, close: p };
  } else {
    return; // out-of-order tick from a bucket already closed -- demo skips it
  }
  candles.update(bar);
  ticks++; lastPrice = p;
}

function showStatus() {
  const avNow = av.vol > 0 ? ` · avwap(${ANCHOR.slice(11, 16)}Z) ${(av.pv / av.vol).toFixed(2)}` : '';
  status.innerHTML = `<b>live</b> — ${ticks} ticks · last ${lastPrice?.toFixed(2)}${avNow}`;
}

const ws = new WebSocket('ws://127.0.0.1:5999/');
ws.onopen = () => {
  status.textContent = 'connected — requesting bars + avwap, subscribing';
  ws.send(JSON.stringify({ type: 'bars', sym: SYM, interval: INTERVAL_S }));
  ws.send(JSON.stringify({ type: 'sub', syms: [SYM] }));
  ws.send(JSON.stringify({ type: 'avwap', sym: SYM, anchor: ANCHOR }));
};
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.table === 'bars') {
    const data = m.data.map(b => ({ time: bucketSec(b.barTime), open: b.open, high: b.high, low: b.low, close: b.close }));
    candles.setData(data);
    bar = data[data.length - 1] || null;
    chart.timeScale().fitContent();
  } else if (m.table === 'avwap') {
    // collapse to one point per BAR bucket (last value wins): setData needs
    // unique ascending times, and sub-bar points would shrink the time
    // scale's unit to seconds, drawing the candles skinny
    const bySec = new Map(m.data.map(p => [bucketSec(p.time), p.avwap]));
    avLine.setData([...bySec].map(([time, value]) => ({ time, value })));
    av.pv = m.pv; av.vol = m.vol; av.ready = true;
    av.lastSec = Math.max(0, ...bySec.keys());
    // per-second line points re-derive the time scale's bar unit, which
    // collapses the view to seconds -- re-fit after the second seed lands
    chart.timeScale().fitContent();
    showStatus();
  } else if (m.table === 'trades') {
    m.data.forEach(applyTick);
    if (av.ready && m.data.length) {
      for (const r of m.data) { av.pv += r.price * (r.size || 0); av.vol += r.size || 0; }
      const sec = bucketSec(m.data[m.data.length - 1].time);
      if (av.vol > 0 && sec >= av.lastSec) {
        avLine.update({ time: sec, value: av.pv / av.vol }); // same-bucket update replaces
        av.lastSec = sec;
      }
    }
    showStatus();
  }
};
ws.onclose = () => { status.textContent = 'disconnected'; };
ws.onerror = () => { status.textContent = 'websocket error — is the openbb-kdb container up?'; };
</script>
</body>
</html>
