<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>kdb tick cache — live chart test</title>
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #111; color: #ddd; }
  #status { font-size: 13px; margin-bottom: 8px; }
  #status b { color: #6c6; }
  #chart { width: 100%; height: 75vh; }
  #tools { display: inline-flex; gap: 4px; margin-right: 10px; vertical-align: middle; }
  #tools button { background: #1c1c1c; color: #aaa; border: 1px solid #333; border-radius: 4px;
                  padding: 2px 8px; font-size: 13px; cursor: pointer; }
  #tools button.active { background: #2c313a; color: #fff; border-color: #61afef; }
</style>
</head>
<body>
<div>
  <span id="tools">
    <button id="tool-anchor" class="active" title="click the chart to anchor an AVWAP">⚓ anchor</button>
    <button id="tool-trend" title="two clicks draw a trendline">╱ trendline</button>
  </span>
  <span id="status">connecting…</span>
</div>
<div id="chart"></div>
<script>
// ?sym=BTC-USD&interval=30&anchor=2026-08-28T14:30:00 to override;
// 10s bars so movement is visible fast; anchor defaults to UTC midnight
const qs = new URLSearchParams(location.search);
const SYM = qs.get('sym') || 'AAPL', INTERVAL_S = Number(qs.get('interval')) || 10;
const ANCHOR = qs.get('anchor') || new Date().toISOString().slice(0, 10) + 'T00:00:00';
const status = document.getElementById('status');

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background: { color: '#111' }, textColor: '#ddd' },
  grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
  timeScale: { timeVisible: true, secondsVisible: true },
});
const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});

// lightweight-charts time = unix seconds, ascending and unique per series
const toSec = (iso) => Math.floor(Date.parse(iso.slice(0, 23) + 'Z') / 1000);
const bucketSec = (iso) => Math.floor(toSec(iso) / INTERVAL_S) * INTERVAL_S;

let bar = null;           // the in-progress bar
let ticks = 0, lastPrice = null;

// Anchored VWAP overlays -- one per anchor, each a series SERVED BY KDB:
// the avwap request returns the trade-true series (sum(price*size)/sum(size)
// from the actual ticks) plus running pv/vol totals, and the client extends
// it per live tick. Click the chart to anchor a new one at that time.
// `ready` gates live accumulation: ticks that arrive before the response
// are already inside the server's sums.
const PALETTE = ['#f0ad4e', '#61afef', '#c678dd', '#98c379', '#e06c75', '#56b6c2'];
const anchors = new Map(); // anchor iso -> {line, pv, vol, lastSec, ready}

function addAnchor(iso, fit) {
  if (anchors.has(iso) || anchors.size >= PALETTE.length || ws.readyState !== 1) return;
  const line = chart.addSeries(LightweightCharts.LineSeries, {
    color: PALETTE[anchors.size % PALETTE.length], lineWidth: 2,
    priceLineVisible: false, title: 'AVWAP ' + iso.slice(11, 16) + 'Z',
  });
  anchors.set(iso, { line, pv: 0, vol: 0, lastSec: 0, ready: false, fit });
  ws.send(JSON.stringify({ type: 'avwap', sym: SYM, anchor: iso }));
}

// Trendlines: pure client-side geometry -- two clicks, a two-point line
// series drawn as a straight segment. Nothing goes to the server.
let tool = 'anchor';
let pendingPoint = null; // first trendline click, awaiting the second
const toolButtons = { anchor: document.getElementById('tool-anchor'), trend: document.getElementById('tool-trend') };
for (const [name, btn] of Object.entries(toolButtons)) {
  btn.onclick = () => {
    tool = name; pendingPoint = null;
    for (const b of Object.values(toolButtons)) b.classList.remove('active');
    btn.classList.add('active');
    showStatus();
  };
}

function drawTrendline(a, b) {
  if (a.time === b.time) return; // zero-width: ignore
  const line = chart.addSeries(LightweightCharts.LineSeries, {
    color: '#abb2bf', lineWidth: 1, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerVisible: false,
  });
  line.setData(a.time < b.time ? [a, b] : [b, a]);
}

chart.subscribeClick((p) => {
  if (!p.time) return;
  if (tool === 'anchor') {
    addAnchor(new Date(p.time * 1000).toISOString().slice(0, 19), false);
    return;
  }
  if (!p.point) return;
  const point = { time: p.time, value: candles.coordinateToPrice(p.point.y) };
  if (point.value == null) return;
  if (!pendingPoint) { pendingPoint = point; } else { drawTrendline(pendingPoint, point); pendingPoint = null; }
  showStatus();
});

function applyTick(r) {
  const t = bucketSec(r.time), p = r.price, v = r.size || 0;
  if (bar && bar.time === t) {
    bar.high = Math.max(bar.high, p); bar.low = Math.min(bar.low, p);
    bar.close = p;
  } else if (!bar || t > bar.time) {
    bar = { time: t, open: p, high: p, low: p, close: p };
  } else {
    return; // out-of-order tick from a bucket already closed -- demo skips it
  }
  candles.update(bar);
  ticks++; lastPrice = p;
}

function showStatus() {
  const parts = [...anchors.entries()]
    .filter(([, a]) => a.vol > 0)
    .map(([iso, a]) => `avwap(${iso.slice(11, 16)}Z) ${(a.pv / a.vol).toFixed(2)}`);
  const avNow = parts.length ? ' · ' + parts.join(' · ') : '';
  const hint = tool === 'trend'
    ? (pendingPoint ? 'trendline: click the second point' : 'trendline: click the first point')
    : 'click chart to anchor';
  status.innerHTML = `<b>live</b> — ${ticks} ticks · last ${lastPrice?.toFixed(2)}${avNow} · ${hint}`;
}

const ws = new WebSocket('ws://127.0.0.1:5999/');
ws.onopen = () => {
  status.textContent = 'connected — requesting bars + avwap, subscribing';
  ws.send(JSON.stringify({ type: 'bars', sym: SYM, interval: INTERVAL_S }));
  ws.send(JSON.stringify({ type: 'sub', syms: [SYM] }));
  addAnchor(ANCHOR, true);
};
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.table === 'bars') {
    const data = m.data.map(b => ({ time: bucketSec(b.barTime), open: b.open, high: b.high, low: b.low, close: b.close }));
    candles.setData(data);
    bar = data[data.length - 1] || null;
    chart.timeScale().fitContent();
  } else if (m.table === 'avwap') {
    const a = anchors.get(m.anchor);
    if (!a) return;
    // collapse to one point per BAR bucket (last value wins): setData needs
    // unique ascending times, and sub-bar points would shrink the time
    // scale's unit to seconds, drawing the candles skinny
    const bySec = new Map(m.data.map(p => [bucketSec(p.time), p.avwap]));
    a.line.setData([...bySec].map(([time, value]) => ({ time, value })));
    a.pv = m.pv; a.vol = m.vol; a.ready = true;
    a.lastSec = Math.max(0, ...bySec.keys());
    // per-second line points re-derive the time scale's bar unit, which
    // collapses the view to seconds -- re-fit after the initial seed lands
    // (not for click-added anchors: yanking the view under a click is rude)
    if (a.fit) chart.timeScale().fitContent();
    showStatus();
  } else if (m.table === 'trades') {
    m.data.forEach(applyTick);
    if (m.data.length) {
      const sec = bucketSec(m.data[m.data.length - 1].time);
      for (const a of anchors.values()) {
        if (!a.ready) continue;
        for (const r of m.data) { a.pv += r.price * (r.size || 0); a.vol += r.size || 0; }
        if (a.vol > 0 && sec >= a.lastSec) {
          a.line.update({ time: sec, value: a.pv / a.vol }); // same-bucket update replaces
          a.lastSec = sec;
        }
      }
    }
    showStatus();
  }
};
ws.onclose = () => { status.textContent = 'disconnected'; };
ws.onerror = () => { status.textContent = 'websocket error — is the openbb-kdb container up?'; };
</script>
</body>
</html>
